<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Page not found | Mobberley C.E. Primary School concept</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:400 18px/1.6 "Nunito Sans",system-ui,sans-serif;color:#17224A;background:#fff}
main{flex:1;display:grid;place-items:center;padding:64px 24px;text-align:center}
.big{font:800 clamp(96px,22vw,200px)/1 Lexend,sans-serif;color:#1B2B5E;letter-spacing:-.04em}
.big i{display:inline-block;width:.14em;height:.14em;background:#FFC93C;margin-left:.04em}
h1{font:800 clamp(28px,5vw,44px)/1.1 Lexend,sans-serif;margin:8px 0 12px}
p{margin:0 auto 28px;max-width:480px;color:#4A5578}
a.btn{display:inline-block;padding:15px 28px;border-radius:999px;background:#1B2B5E;color:#fff;font-weight:700;text-decoration:none;margin:4px}
a.btn.sun{background:#FFC93C;color:#17224A}
a:focus-visible{outline:3px solid #1F6B45;outline-offset:3px}
footer{background:#17224A;color:#C9D4F5;padding:24px;text-align:center;font-size:15px}
footer a{color:#FFC93C}
</style>
</head>
<body>
<main>
<div>
<div class="big" aria-hidden="true">404<i></i></div>
<h1>This page has wandered off.</h1>
<p>We couldn't find the page you were looking for. It may have moved, or the address may have a typo.</p>
<a class="btn sun" href="/">Back to the homepage</a>
<a class="btn" href="/#contact">Contact the office</a>
</div>
</main>
<footer>Design concept by <a href="https://pixel-north.co.uk/">Pixel North</a>. Not the school's official website.</footer>
</body>
</html>
